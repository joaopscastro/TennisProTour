services:
  postgres:
    image: postgres:16-alpine
    container_name: tennis-manager-postgres
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis_manager
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tennis -d tennis_manager']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
